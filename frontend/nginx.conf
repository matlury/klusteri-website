user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn; 
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Enable access logs for debugging (to stdout for Docker)
    access_log  /dev/stdout;
    error_log   /dev/stderr;
    tcp_nopush     on;
    tcp_nodelay    on;

    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Cache configuration for the iCal feed
    proxy_cache_path /var/cache/nginx/api_cache levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

    # Single server block for both frontend and API
    server {
        listen 5173;  # Development port for consistency
        server_name localhost;

        # Root directory for React build
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Specialized cache for iCal to offload backend completely
        location /api/events/ical/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_cache api_cache;
            proxy_cache_valid 200 15m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            add_header X-Cache-Status $upstream_cache_status;
            
            # Ensure clients also know they can cache it
            expires 15m;
            add_header Cache-Control "public, no-transform";
        }

        # API proxy - route /api/* to backend
        location /api/ {
            proxy_pass http://api:8000;  # Backend service on port 8000
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Match gunicorn timeout
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Frontend SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}